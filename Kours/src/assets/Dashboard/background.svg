<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 194 259" width="388" height="518" overflow="visible" font-family="'Segoe UI','Helvetica Neue',Arial,sans-serif">
  <defs>
    <!-- Dgrad de fond de la carte : transparent -->
    <linearGradient id="cardGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="transparent"/>
      <stop offset="45%" stop-color="transparent"/>
      <stop offset="100%" stop-color="transparent"/>
    </linearGradient>

    <!-- Lueur lavande en haut  gauche -->
    <radialGradient id="glowTL" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#6f77b0" stop-opacity="0.85"/>
      <stop offset="55%" stop-color="#4b5278" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#2a3060" stop-opacity="0"/>
    </radialGradient>

    <!-- Lueur violette  droite / bas-droite -->
    <radialGradient id="glowR" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#5c5ead" stop-opacity="0.9"/>
      <stop offset="55%" stop-color="#3a3b8f" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#262a66" stop-opacity="0"/>
    </radialGradient>

    <!-- Avion en papier : dgrads clair / ombre -->
    <linearGradient id="planeLight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9a9cff"/>
      <stop offset="100%" stop-color="#6a6ddf"/>
    </linearGradient>
    <linearGradient id="planeMid" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7b7df8"/>
      <stop offset="100%" stop-color="#5053c5"/>
    </linearGradient>
    <linearGradient id="planeDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#575ac9"/>
      <stop offset="100%" stop-color="#3f4199"/>
    </linearGradient>

    <linearGradient id="btnGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2e3192"/>
      <stop offset="100%" stop-color="#3a3db0"/>
    </linearGradient>

    <filter id="soft" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="soft2" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <!-- Carte (fond transparent) -->
  <rect x="8" y="26" width="176" height="210" rx="16" fill="url(#cardGrad)"/>

  <!-- Lueurs floues : overflow visible (pas de clip) -->
  <g>
    <ellipse cx="46" cy="74" rx="62" ry="50" fill="url(#glowTL)" filter="url(#soft)"/>
    <ellipse cx="172" cy="150" rx="66" ry="80" fill="url(#glowR)" filter="url(#soft)"/>
    <ellipse cx="150" cy="226" rx="60" ry="46" fill="url(#glowR)" filter="url(#soft)"/>
    <!-- Arc lumineux violet/rose sous l'avion -->
    <path d="M60 118 Q122 150 176 96" fill="none" stroke="#b79bff" stroke-width="1.4" stroke-linecap="round" opacity="0.8" filter="url(#soft2)"/>
    <path d="M66 116 Q122 146 170 100" fill="none" stroke="#d9c7ff" stroke-width="0.7" stroke-linecap="round" opacity="0.9"/>
  </g>

  <!-- Trainee pointillee de l'avion -->
  <path d="M58 122 Q88 106 112 58" fill="none" stroke="#c9c4f0" stroke-width="1.2"
        stroke-linecap="round" stroke-dasharray="3 4" opacity="0.75"/>

  <!-- Avion en papier -->
  <g>
    <path d="M148 34 L118 62 L132 66 Z" fill="url(#planeDark)"/>
    <path d="M148 34 L132 66 L138 78 Z" fill="url(#planeMid)"/>
    <path d="M148 34 L138 78 L118 62 Z" fill="url(#planeLight)"/>
  </g>

  <!-- Titre -->
  <text x="26" y="121" fill="#ffffff" font-size="12.5" font-weight="700" letter-spacing="-0.2">Ensemble</text>
  <text x="26" y="137" fill="#ffffff" font-size="12.5" font-weight="700" letter-spacing="-0.2">on va plus loin !</text>

  <!-- Sous-titre -->
  <text x="26" y="157" fill="#e6e7f2" fill-opacity="0.82" font-size="9.2" letter-spacing="-0.1">Partage tes cours et aide</text>
  <text x="26" y="170" fill="#e6e7f2" fill-opacity="0.82" font-size="9.2" letter-spacing="-0.1">d’autres étudiants</text>

</svg>
